<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <link rel="stylesheet" href="anchor-scope.css">
    <script src="anchor-scope.js" defer></script>
    <title>Scoping potential anchors</title>
</head>
<body>
    <main>
  <div class="wrapper">
    <article class="flow">
      <h1>anchor-scope</h1>
       <label class="toggle" for="apply-scope">
         <span class="toggle__label">Apply <code>anchor-scope</code></span>
        <input type="checkbox" role="switch" class="toggle__element" id="apply-scope" checked/>
        <div class="toggle__decor" aria-hidden="true">
          <div class="toggle__thumb"></div>
        </div>
      </label>
      <ul id="wrapper">
        <li>
          <img src="https://images.unsplash.com/photo-1548032885-b5e38734688a?crop=entropy&cs=srgb&fm=jpg&ixid=M3wzMjM4NDZ8MHwxfHJhbmRvbXx8fHx8fHx8fDE3NTM4OTcyMDR8&ixlib=rb-4.1.0&q=85&w=200&h=100&fit=crop" alt="Bright blue waves crashing onto a rocky shore from above." />
          <div class="banner">#ocean</div>
        </li>
        <li>
          <img src="https://images.unsplash.com/photo-1534709153997-d6659469f951?crop=entropy&cs=srgb&fm=jpg&ixid=M3wzMjM4NDZ8MHwxfHJhbmRvbXx8fHx8fHx8fDE3NTM4OTcxMzZ8&ixlib=rb-4.1.0&q=85&w=250&h=150&fit=crop" alt="A low angle of a ball painted to look like the earth." />
          <div class="banner">#bugs-eye-view</div>
        </li>
         <li>
          <img src="https://images.unsplash.com/photo-1481555716071-8830d3e254ba?crop=entropy&cs=srgb&fm=jpg&ixid=M3wzMjM4NDZ8MHwxfHJhbmRvbXx8fHx8fHx8fDE3NTM4OTcwNTl8&ixlib=rb-4.1.0&q=85&w=120&h=150&fit=crop" alt="A combine mowing hay, with dust rising" />
          <div class="banner">#agriculture</div>
        </li>
        <li>
          <img src="https://images.unsplash.com/photo-1611023802893-0915db72ac9d?crop=entropy&cs=srgb&fm=jpg&ixid=M3wzMjM4NDZ8MHwxfHJhbmRvbXx8fHx8fHx8fDE3NTM4OTY5OTd8&ixlib=rb-4.1.0&q=85&w=180&h=140&fit=crop" alt="A shallow rocky tidepool"/>
          <div class="banner">#tide-pools</div>
        </li>
         <li>
          <img src="https://images.unsplash.com/photo-1475113548554-5a36f1f523d6?crop=entropy&cs=srgb&fm=jpg&ixid=M3wzMjM4NDZ8MHwxfHJhbmRvbXx8fHx8fHx8fDE3NTM4OTY5MjV8&ixlib=rb-4.1.0&q=85&w=100&=150&fit=crop" alt="Sunset behind a field."/>
          <div class="banner">#sunset</div>
        </li>
        <li>
          <img src="https://images.unsplash.com/photo-1462400362591-9ca55235346a?crop=entropy&cs=srgb&fm=jpg&ixid=M3wzMjM4NDZ8MHwxfHJhbmRvbXx8fHx8fHx8fDE3NTM4OTY2MTR8&ixlib=rb-4.1.0&q=85&w=250&h=150&fit=crop" alt="Sunset on a beach with a wave breaking into a cove."/>
          <div class="banner">#beach</div>
        </li>
      </ul>

    </article>
  </div>
</main>
</body>
</html>
