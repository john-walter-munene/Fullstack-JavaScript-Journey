<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <link rel="stylesheet" href="play.css">
    <title>Pseudo Elements</title>
</head>
<body>
    <figure class="callout">
        <p>
            A callout with a nice, decorative icon. The icon is added with a <code>::before</code> 
            pseudo-element, which sets inline SVG with <a href="https://css-tricks.com/lodge/svg/09-svg-data-uris/">a data URI</a>,
            via the <code>background</code> property.
        </p>
</figure>
</body>
</html>
