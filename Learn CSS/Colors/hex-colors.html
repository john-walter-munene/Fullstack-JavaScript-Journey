<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <link rel="stylesheet" href="hex-colors.css">
    <title>Numeric colors: Hexadecimal</title>
</head>
<body>
    <main>
  <div class="wrapper">
    <article class="flow">
      <h1>HEX Colors</h1>
      <ul class="auto-grid" role="list">
        <li class="swatch">
          <div class="swatch__sample" style="background: #b71540" aria-hidden="true"></div>
          <code>#b71540</code>
        </li>

        <li class="swatch">
          <div class="swatch__sample" style="background: #60a3bc" aria-hidden="true"></div>
          <code>#60a3bc</code>
        </li>

        <li class="swatch">
          <div class="swatch__sample" style="background: #f6b93b" aria-hidden="true"></div>
          <code>#f6b93b</code>
        </li>

        <li class="swatch">
          <div class="swatch__sample" style="background: #000000" aria-hidden="true"></div>
          <code>#000000</code>
        </li>

        <li class="swatch">
          <div class="swatch__sample" style="background: #00000080" aria-hidden="true"></div>
          <code>#00000080</code>
          <p>50% Alpha</p>
        </li>

        <li class="swatch">
          <div class="swatch__sample" style="background: #000000BF" aria-hidden="true"></div>
          <code>#000000BF</code>
          <p>75% Alpha</p>
        </li>
      </ul>
    </article>
  </div>
</main>
</body>
</html>
