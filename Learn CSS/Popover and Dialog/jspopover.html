<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <script src="jspopover.js" defer></script>
    <title>Controlling Popover with JavaScript</title>
</head>
<body>
    <main>
        <div class="wrapper">
            <article class="flow">
                <button id="hoverPopover">Show Popover on hover</button>
                <div>
                    <label for="input">Type <samp>show</samp> or <samp>hide</samp> to control the popover.</label>
                    <input id="input" />
                </div>
            </article>
        </div>
    </main>

<div popover id="my-popover" class="box">
  <h2>This is a popover.</h2>
</div>
</body>
</html>
